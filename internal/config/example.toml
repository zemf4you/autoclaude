# AutoClaude configuration.
#
# Lines that start with "#" right before a setting are examples: remove the
# "#" to turn them on. After any change, run `autoclaude install` again.
#
# Keep this file private: it holds your provider keys.

# Address the gateway listens on. It must be a loopback address.
listen = "127.0.0.1:8484"


# ── Providers ────────────────────────────────────────────────────────────────
#
# The services that run your models. Each must speak the Anthropic Messages
# API; for an OpenAI-only endpoint, put a translator such as LiteLLM in front.
# The name after "providers." is yours to choose.
#
#   base_url   where the provider serves the API, without "/v1/messages"
#   api_key    your key; leave it out for a local server that needs none

#[providers.deepseek]
#base_url = "https://api.deepseek.com/anthropic"
#api_key = "sk-..."

#[providers.openrouter]
#base_url = "https://openrouter.ai/api"
#api_key = "sk-or-..."

#[providers.local]
#base_url = "http://127.0.0.1:8000" # vLLM, llama.cpp, Ollama


# ── Models ───────────────────────────────────────────────────────────────────
#
# Your models, one [[model]] block each. A model that is not listed here goes
# to Anthropic on your subscription.
#
#   id         what you pick in Claude Code: `/model deepseek-v4-pro`
#   provider   the name of one of the providers above
#   upstream   the model's name at the provider, if it differs from id
#   menu       the name of the model's own entry in the menu of Claude Desktop

#[[model]]
#id = "deepseek-v4-pro"
#provider = "deepseek"
#menu = "DeepSeek V4 Pro"

#[[model]]
#id = "qwen"
#provider = "local"
#upstream = "Qwen/Qwen3-Coder-30B-A3B-Instruct"
#menu = "Qwen 3 Coder"


# ── Claude Desktop menu ──────────────────────────────────────────────────────
#
# Claude Desktop lists only Claude models. There are two ways to pick your
# own model there; use one or the other.
#
# 1. Entries of their own: give your models a `menu` name, as above.
#    `autoclaude install` then adds a certificate for claude.ai to your user
#    account, asking for your password, and puts the gateway between Claude
#    Desktop and claude.ai. Anthropic does not support this: read "Anthropic's
#    terms" in the README before you turn it on.
#
# 2. Borrowed entries, no certificate: leave `menu` out everywhere and give a
#    model the id of a Claude model you do not use. The menu entry keeps its
#    name and your model answers. The entries under "More models" are good
#    candidates: claude-opus-4-6, claude-opus-4-7, claude-opus-4-8,
#    claude-sonnet-4-6, claude-opus-5, claude-sonnet-5, claude-fable-5,
#    claude-fable-5-1, claude-haiku-4-5-20251001. For example:
#
#      [[model]]
#      id = "claude-opus-4-6"
#      provider = "deepseek"
#      upstream = "deepseek-v4-pro"
